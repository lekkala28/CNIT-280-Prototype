<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer Sign Up | Special Space</title>

<style>
* {
  box-sizing: border-box;
  color: #ffffff;
}
body {
  margin: 0;
  padding-left: 220px;
  font-family: Arial, sans-serif;
  background-color: #0b1220;
}
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 220px;
  height: 100%;
  background-color: black;
  padding-top: 20px;
  overflow-y: auto;
  z-index: 100;
}
.sidebar a { text-decoration: none; }
.sidebar button {
  display: block;
  width: 80%;
  margin: 10px auto;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background-color: white;
  color: black;
  font-weight: bold;
  cursor: pointer;
  font-family: Arial, sans-serif;
}
.sidebar button:hover { background-color: #d9d9d9; }
header {
  padding: 25px;
  text-align: center;
  background: #111a2e;
}
main {
  display: flex;
  flex-wrap: wrap;
  max-width: 1100px;
  margin: auto;
  gap: 20px;
  padding: 20px;
}
.card {
  background: #111a2e;
  padding: 20px;
  border-radius: 12px;
  flex: 1;
  min-width: 320px;
}
.volunteer {
  background: #0f1730;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.small { font-size: 14px; }
button {
  background: #6ea8ff;
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
}
button.danger { background: #ff6b6b; }
input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  margin-bottom: 12px;
  border-radius: 8px;
  border: none;
  background: #0f1730;
}
input.invalid, textarea.invalid {
  outline: 2px solid #ff6b6b;
}
textarea {
  min-height: 80px;
  resize: vertical;
}
.confirmation {
  display: none;
  background: #1a4d1a;
  border-left: 5px solid #33cc33;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 14px;
  font-size: 15px;
}
.error-msg {
  display: none;
  color: #ffb3b3;
  font-size: 14px;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="sidebar">
  <a href="index.html"><button>Home</button></a>
  <a href="dashboard.html"><button>Dashboard</button></a>
  <a href="events.html"><button>Events</button></a>
  <a href="volunteer.html"><button>Volunteer</button></a>
  <a href="jobs.html"><button>Open Jobs</button></a>
  <a href="appointments.html"><button>Appointments</button></a>
  <a href="families.html"><button>Families</button></a>
  <a href="success.html"><button>Success Stories</button></a>
  <a href="health.html"><button>Health Info</button></a>
  <a href="background.html"><button>Background Check</button></a>
  <a href="newsletter.html"><button>Newsletter</button></a>
  <a href="help.html"><button>Help</button></a>
  <a href="contact.html"><button>Contact</button></a>
  <a href="login.html"><button>Login</button></a>
  <button onclick="alert('Logout')">Logout</button>
</div>

<header>
  <h1>Volunteer Sign Up</h1>
  <p>Register your information to join the Special Space volunteer community.</p>
</header>

<main>

  <section class="card">
    <h2>Registered Volunteers</h2>
    <div id="volunteerList"></div>
    <button class="danger" onclick="clearAll()">Clear All</button>
  </section>

  <section class="card">
    <h2>Sign Up</h2>

    <div id="confirmation" class="confirmation">Sign-up submitted successfully. Thanks for joining.</div>
    <div id="errorMsg" class="error-msg">Please complete all required fields.</div>

    <form id="volunteerForm" novalidate>
      <label>First Name *</label>
      <input type="text" id="firstName">

      <label>Last Name *</label>
      <input type="text" id="lastName">

      <label>Email</label>
      <input type="email" id="email">

      <label>Phone</label>
      <input type="tel" id="phone">

      <label>Interests / Talents</label>
      <textarea id="interests" placeholder="Briefly describe your interests, skills, or talents..."></textarea>

      <button type="submit">Submit</button>
    </form>
  </section>

</main>

<script>
const STORAGE_KEY = "special_space_volunteers";

const defaultVolunteers = [
  {
    firstName: "Sarah",
    lastName: "Williams",
    name: "Sarah Williams",
    email: "sarah@email.com",
    phone: "555-333-4444",
    interestsTalents: "Event planning, working with kids, photography.",
    backgroundCheck: { status: "Completed", completionDate: "2026-03-12", organization: "SafeScreen Inc" }
  },
  {
    firstName: "Michael",
    lastName: "Johnson",
    name: "Michael Johnson",
    email: "mj@email.com",
    phone: "555-111-2222",
    interestsTalents: "Mentoring teens, basketball coaching, public speaking.",
    backgroundCheck: { status: "Expired", completionDate: "2024-11-20", organization: "VerifiedCheck Group" }
  },
  {
    firstName: "Emily",
    lastName: "Davis",
    name: "Emily Davis",
    email: "emily@email.com",
    phone: "555-777-8888",
    interestsTalents: "Music, sensory-friendly activities, sign language (beginner).",
    backgroundCheck: { status: "None", completionDate: "", organization: "" }
  }
];

let volunteers = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultVolunteers;
saveData();

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(volunteers));
}

function escapeHtml(str) {
  return String(str || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function renderVolunteers() {
  const list = document.getElementById("volunteerList");
  list.innerHTML = "";

  if (volunteers.length === 0) {
    list.innerHTML = "<p>No volunteers yet.</p>";
    return;
  }

  volunteers.forEach((v, index) => {
    const div = document.createElement("div");
    div.className = "volunteer";
    const interests = v.interestsTalents || "";
    const interestsLine = interests ? `<br><span class="small">${escapeHtml(interests)}</span>` : "";

    div.innerHTML = `
      <div>
        <strong>${escapeHtml(v.name)}</strong><br>
        <span class="small">${escapeHtml(v.email || "")}${v.phone ? " &bull; " + escapeHtml(v.phone) : ""}</span>
        ${interestsLine}
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button type="button" onclick="goToBackground(${index})">View</button>
        <button type="button" class="danger" onclick="deleteVolunteer(${index})">Delete</button>
      </div>
    `;

    list.appendChild(div);
  });
}

function goToBackground(index) {
  const volunteer = volunteers[index];
  localStorage.setItem("selected_volunteer", JSON.stringify(volunteer));
  window.location.href = "backgroundcheck.html";
}

function deleteVolunteer(index) {
  volunteers.splice(index, 1);
  saveData();
  renderVolunteers();
}

function clearAll() {
  if (confirm("Clear all volunteers?")) {
    volunteers = [];
    saveData();
    renderVolunteers();
  }
}

function clearInvalid() {
  ["firstName", "lastName", "email", "phone", "interests"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.remove("invalid");
  });
  document.getElementById("errorMsg").style.display = "none";
}

function showConfirmation() {
  const el = document.getElementById("confirmation");
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 4000);
}

document.getElementById("volunteerForm").addEventListener("submit", function(e) {
  e.preventDefault();
  clearInvalid();

  const firstEl = document.getElementById("firstName");
  const lastEl = document.getElementById("lastName");
  const emailEl = document.getElementById("email");
  const phoneEl = document.getElementById("phone");
  const interestsEl = document.getElementById("interests");

  const firstName = firstEl.value.trim();
  const lastName = lastEl.value.trim();

  let valid = true;
  if (!firstName) { firstEl.classList.add("invalid"); valid = false; }
  if (!lastName) { lastEl.classList.add("invalid"); valid = false; }

  if (!valid) {
    document.getElementById("errorMsg").style.display = "block";
    return;
  }

  const newVolunteer = {
    firstName: firstName,
    lastName: lastName,
    name: firstName + " " + lastName,
    email: emailEl.value.trim(),
    phone: phoneEl.value.trim(),
    interestsTalents: interestsEl.value.trim(),
    backgroundCheck: { status: "None", completionDate: "", organization: "" }
  };

  volunteers.push(newVolunteer);
  saveData();
  renderVolunteers();
  this.reset();
  showConfirmation();
});

renderVolunteers();
</script>

</body>
</html>
