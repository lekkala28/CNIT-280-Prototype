<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer Directory | Special Space</title>

<style>
* {
  box-sizing: border-box;
  color: #ffffff;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #0b1220;
}

header {
  padding: 25px;
  text-align: center;
  background: #111a2e;
}

main {
  display: flex;
  flex-wrap: wrap;
  max-width: 1100px;
  margin: auto;
  gap: 20px;
  padding: 20px;
}

.card {
  background: #111a2e;
  padding: 20px;
  border-radius: 12px;
  flex: 1;
  min-width: 320px;
}

.volunteer {
  background: #0f1730;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.small {
  font-size: 14px;
}

button {
  background: #6ea8ff;
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
}

button.danger {
  background: #ff6b6b;
}

input, select, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  margin-bottom: 12px;
  border-radius: 8px;
  border: none;
  background: #0f1730;
}

textarea {
  min-height: 80px;
  resize: vertical;
}
</style>
</head>

<body>

<header>
  <h1>Volunteer Directory</h1>
  <p>Select a volunteer to view background check information</p>
</header>

<main>

  <section class="card">
    <h2>Registered Volunteers</h2>
    <div id="volunteerList"></div>
    <button class="danger" onclick="clearAll()">Clear All</button>
  </section>

  <section class="card">
    <h2>Add Volunteer</h2>

    <form id="volunteerForm">
      <label>Full Name *</label>
      <input type="text" id="name" required>

      <label>Email</label>
      <input type="email" id="email">

      <label>Phone</label>
      <input type="tel" id="phone">

      <label>Role *</label>
      <select id="role" required>
        <option value="">Select role</option>
        <option>Caregiver Support</option>
        <option>Event Helper</option>
        <option>Mentor / Buddy</option>
        <option>Transportation</option>
        <option>Admin</option>
        <option>Other</option>
      </select>

      <label>Availability *</label>
      <select id="availability" required>
        <option value="">Select availability</option>
        <option>Weekdays</option>
        <option>Weeknights</option>
        <option>Weekends</option>
        <option>Flexible</option>
      </select>

      <label>Background Check Status *</label>
      <select id="bgStatus" required>
        <option value="">Select status</option>
        <option>Completed</option>
        <option>Pending</option>
        <option>Expired</option>
        <option>None</option>
      </select>

      <label>Completion Date</label>
      <input type="date" id="completionDate">

      <label>Organization</label>
      <input type="text" id="organization" placeholder="Ex: SafeScreen Inc">

      <label>Notes</label>
      <textarea id="notes"></textarea>

      <button type="submit">Add Volunteer</button>
    </form>
  </section>

</main>

<script>
const STORAGE_KEY = "special_space_volunteers";

const defaultVolunteers = [
  {
    name: "Sarah Williams",
    email: "sarah@email.com",
    phone: "555-333-4444",
    role: "Event Helper",
    availability: "Weekends",
    notes: "Great with community events",
    backgroundCheck: {
      status: "Completed",
      completionDate: "2026-03-12",
      organization: "SafeScreen Inc"
    }
  },
  {
    name: "Michael Johnson",
    email: "mj@email.com",
    phone: "555-111-2222",
    role: "Mentor / Buddy",
    availability: "Weekdays",
    notes: "Experienced mentor",
    backgroundCheck: {
      status: "Expired",
      completionDate: "2024-11-20",
      organization: "VerifiedCheck Group"
    }
  },
  {
    name: "Emily Davis",
    email: "emily@email.com",
    phone: "555-777-8888",
    role: "Caregiver Support",
    availability: "Flexible",
    notes: "New volunteer",
    backgroundCheck: {
      status: "None",
      completionDate: "",
      organization: ""
    }
  }
];

let volunteers = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultVolunteers;
saveData();

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(volunteers));
}

function escapeHtml(str) {
  return String(str || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function renderVolunteers() {
  const list = document.getElementById("volunteerList");
  list.innerHTML = "";

  if (volunteers.length === 0) {
    list.innerHTML = "<p>No volunteers yet.</p>";
    return;
  }

  volunteers.forEach((v, index) => {
    const div = document.createElement("div");
    div.className = "volunteer";

    const bg = v.backgroundCheck || { status: "None" };

    div.innerHTML = `
      <div>
        <strong>${escapeHtml(v.name)}</strong><br>
        <span class="small">${escapeHtml(v.role)} • ${escapeHtml(v.availability)}</span><br>
        <span class="small">Background Check: ${escapeHtml(bg.status)}</span>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button type="button" onclick="goToBackground(${index})">View</button>
        <button type="button" class="danger" onclick="deleteVolunteer(${index})">Delete</button>
      </div>
    `;

    list.appendChild(div);
  });
}

function goToBackground(index) {
  const volunteer = volunteers[index];
  localStorage.setItem("selected_volunteer", JSON.stringify(volunteer));
  window.location.href = "backgroundcheck.html";
}

function deleteVolunteer(index) {
  volunteers.splice(index, 1);
  saveData();
  renderVolunteers();
}

function clearAll() {
  if (confirm("Clear all volunteers?")) {
    volunteers = [];
    saveData();
    renderVolunteers();
  }
}

document.getElementById("volunteerForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const status = document.getElementById("bgStatus").value;
  const completionDate = document.getElementById("completionDate").value;
  const organization = document.getElementById("organization").value.trim();

  const newVolunteer = {
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    role: document.getElementById("role").value,
    availability: document.getElementById("availability").value,
    notes: document.getElementById("notes").value.trim(),
    backgroundCheck: {
      status: status,
      completionDate: status === "None" ? "" : completionDate,
      organization: status === "None" ? "" : organization
    }
  };

  volunteers.push(newVolunteer);
  saveData();
  renderVolunteers();
  this.reset();
});

renderVolunteers();
</script>

</body>
</html>
