<!DOCTYPE html>
<html>
<head>
  <title>Background Check</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding-left: 220px;
      font-family: Arial, sans-serif;
      background-color: #1a0033;
      color: white;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 220px;
      height: 100%;
      background-color: black;
      padding-top: 20px;
      overflow-y: auto;
      z-index: 100;
    }

    .sidebar a { text-decoration: none; }

    .sidebar button {
      display: block;
      width: 80%;
      margin: 10px auto;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    .sidebar button:hover { background-color: #d9d9d9; }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 50px;
      margin-bottom: 10px;
    }

    .sub {
      font-size: 18px;
      margin-bottom: 40px;
      opacity: 0.8;
    }

    .card {
      background: #2a0055;
      padding: 30px;
      border-radius: 16px;
      text-align: left;
    }

    .section {
      margin-bottom: 25px;
    }

    .label {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .value {
      background: #140026;
      padding: 15px;
      border-radius: 12px;
      font-size: 18px;
    }

    .status {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: bold;
    }

    .completed { background: #2e7d32; }
    .pending   { background: #b28704; }
    .expired   { background: #c62828; }
    .none      { background: #555; }
  </style>
</head>

<body>

<div class="sidebar">
  <a href="index.html"><button>Home</button></a>
  <a href="dashboard.html"><button>Dashboard</button></a>
  <a href="events.html"><button>Events</button></a>
  <a href="volunteer.html"><button>Volunteer</button></a>
  <a href="jobs.html"><button>Open Jobs</button></a>
  <a href="appointments.html"><button>Appointments</button></a>
  <a href="families.html"><button>Families</button></a>
  <a href="success.html"><button>Success Stories</button></a>
  <a href="health.html"><button>Health Info</button></a>
  <a href="background.html"><button>Background Check</button></a>
  <a href="newsletter.html"><button>Newsletter</button></a>
  <a href="help.html"><button>Help</button></a>
  <a href="contact.html"><button>Contact</button></a>
  <a href="login.html"><button>Login</button></a>
  <button onclick="alert('Logout')">Logout</button>
</div>

<div class="container">

  <h1>Background Check</h1>
  <div class="sub" id="volunteerName">Volunteer Profile</div>

  <div class="card">

    <div class="section">
      <div class="label">Status</div>
      <div class="value">
        <span id="status" class="status">None</span>
      </div>
    </div>

    <div class="section">
      <div class="label">Completion Date</div>
      <div class="value" id="date">No date</div>
    </div>

    <div class="section">
      <div class="label">Verified By</div>
      <div class="value" id="org">No organization</div>
    </div>

  </div>

</div>

<script>
const volunteer = JSON.parse(localStorage.getItem("selected_volunteer"));

const nameEl = document.getElementById("volunteerName");
const statusEl = document.getElementById("status");
const dateEl = document.getElementById("date");
const orgEl = document.getElementById("org");

if (!volunteer) {
  nameEl.innerText = "No Volunteer Selected";
} else {
  nameEl.innerText = "Volunteer Profile: " + volunteer.name;

  const bg = volunteer.backgroundCheck || { status: "None" };

  statusEl.innerText = bg.status || "None";

  if (bg.status === "Completed") statusEl.className = "status completed";
  else if (bg.status === "Pending") statusEl.className = "status pending";
  else if (bg.status === "Expired") statusEl.className = "status expired";
  else statusEl.className = "status none";

  dateEl.innerText = bg.completionDate || "No date";
  orgEl.innerText = bg.organization || "No organization";
}
</script>

</body>
</html>
