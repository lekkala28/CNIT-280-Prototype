<!DOCTYPE html>
<html>
<head>
<title>Special Space Login</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    background-color:#1a0033;
    font-family:Arial;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:black;
    padding:40px;
    border-radius:15px;
    width:300px;
    text-align:center;
}

h1{
    font-family:'Orbitron', sans-serif;
}

input{
    width:90%;
    padding:10px;
    margin:10px 0;
    border:none;
    border-radius:6px;
}

button{
    width:95%;
    padding:10px;
    background:white;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ddd;
}

</style>

<script>

function login(){

    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user !== "" && pass !== ""){
        window.location.href = "index.html";
    }
    else{
        alert("Please enter username and password");
    }

}

</script>

</head>

<body>

<div class="login-box">

<h1>Special Space</h1>

<p>Login to continue</p>

<input id="username" type="text" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

</body>
</html>
