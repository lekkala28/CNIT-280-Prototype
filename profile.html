<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profile | Special Space</title>

<style>
*{
  box-sizing:border-box;
  color:#ffffff; /* ALL TEXT WHITE */
}

body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#0b1220;
}

header{
  padding:25px;
  text-align:center;
  background:#111a2e;
}

main{
  max-width:1100px;
  margin:auto;
  padding:20px;
  display:flex;
  flex-wrap:wrap;
  gap:20px;
}

.card{
  background:#111a2e;
  border-radius:12px;
  padding:20px;
  flex:1;
  min-width:320px;
}

input, select, textarea{
  width:100%;
  padding:10px;
  margin-top:6px;
  margin-bottom:12px;
  border-radius:8px;
  border:none;
  background:#0f1730;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  background:#6ea8ff;
  border:none;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
}

button.danger{
  background:#ff6b6b;
}

.small{
  font-size:14px;
  opacity:0.95;
}

.profileBox{
  background:#0f1730;
  padding:14px;
  border-radius:10px;
}

.row{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.row > div{
  flex:1;
  min-width:200px;
}

hr{
  border:none;
  border-top:1px solid rgba(255,255,255,0.15);
  margin:16px 0;
}
</style>
</head>

<body>
<header>
  <h1>My Profile</h1>
  <p class="small">Create your profile so families and volunteers can connect.</p>
</header>

<main>
  <!-- LEFT: Current profile display -->
  <section class="card">
    <h2>Current Profile</h2>
    <div id="profileDisplay" class="profileBox"></div>
    <hr />
    <button class="danger" type="button" onclick="clearProfile()">Clear Profile</button>
  </section>

  <!-- RIGHT: Edit profile -->
  <section class="card">
    <h2>Create / Update Profile</h2>

    <form id="profileForm">
      <label>Full Name *</label>
      <input id="fullName" type="text" required placeholder="e.g., Alex Johnson" />

      <div class="row">
        <div>
          <label>Email</label>
          <input id="email" type="email" placeholder="alex@email.com" />
        </div>
        <div>
          <label>Phone</label>
          <input id="phone" type="tel" placeholder="(555) 555-5555" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>I am a *</label>
          <select id="userType" required>
            <option value="">Select one</option>
            <option>Parent / Family Member</option>
            <option>Caregiver</option>
            <option>Person with Special Needs</option>
            <option>Volunteer</option>
            <option>Other</option>
          </select>
        </div>
        <div>
          <label>City / Area</label>
          <input id="location" type="text" placeholder="Whispering Hills" />
        </div>
      </div>

      <label>Support Needed (or Support You Can Offer)</label>
      <textarea id="support" placeholder="e.g., looking for weekend activities, respite care, tutoring, event help..."></textarea>

      <label>Bio</label>
      <textarea id="bio" placeholder="Write a short intro about yourself..."></textarea>

      <label>Preferred Contact Method</label>
      <select id="contactMethod">
        <option>Email</option>
        <option>Phone</option>
        <option>No preference</option>
      </select>

      <button type="submit">Save Profile</button>
    </form>
  </section>
</main>

<script>
const PROFILE_KEY = "special_space_profile_v1";

function loadProfile(){
  try{
    const raw = localStorage.getItem(PROFILE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch{
    return null;
  }
}

function saveProfile(profile){
  localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
}

function renderProfile(){
  const box = document.getElementById("profileDisplay");
  const p = loadProfile();

  if(!p){
    box.innerHTML = "<p class='small'>No profile saved yet. Use the form to create one.</p>";
    return;
  }

  box.innerHTML = `
    <h3 style="margin-top:0;">${escapeHtml(p.fullName)}</h3>
    <p class="small"><strong>Type:</strong> ${escapeHtml(p.userType)}</p>
    <p class="small"><strong>Location:</strong> ${escapeHtml(p.location || "Not provided")}</p>
    <p class="small"><strong>Contact:</strong> ${escapeHtml(p.contactMethod || "Email")}</p>
    <p class="small"><strong>Email:</strong> ${escapeHtml(p.email || "Not provided")}</p>
    <p class="small"><strong>Phone:</strong> ${escapeHtml(p.phone || "Not provided")}</p>
    <p class="small"><strong>Support:</strong> ${escapeHtml(p.support || "Not provided")}</p>
    <p class="small"><strong>Bio:</strong> ${escapeHtml(p.bio || "Not provided")}</p>
    <p class="small"><em>Last updated:</em> ${new Date(p.updatedAt).toLocaleString()}</p>
  `;
}

function clearProfile(){
  if(confirm("Clear your saved profile?")){
    localStorage.removeItem(PROFILE_KEY);
    document.getElementById("profileForm").reset();
    renderProfile();
  }
}

function escapeHtml(str){
  return String(str || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

document.getElementById("profileForm").addEventListener("submit", (e) => {
  e.preventDefault();

  const profile = {
    fullName: document.getElementById("fullName").value.trim(),
    email: document.getElementById("email").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    userType: document.getElementById("userType").value,
    location: document.getElementById("location").value.trim(),
    support: document.getElementById("support").value.trim(),
    bio: document.getElementById("bio").value.trim(),
    contactMethod: document.getElementById("contactMethod").value,
    updatedAt: Date.now()
  };

  if(!profile.fullName || !profile.userType){
    return;
  }

  saveProfile(profile);
  renderProfile();
  alert("Profile saved!");
});

// Prefill form if profile exists
(function init(){
  const p = loadProfile();
  if(p){
    document.getElementById("fullName").value = p.fullName || "";
    document.getElementById("email").value = p.email || "";
    document.getElementById("phone").value = p.phone || "";
    document.getElementById("userType").value = p.userType || "";
    document.getElementById("location").value = p.location || "";
    document.getElementById("support").value = p.support || "";
    document.getElementById("bio").value = p.bio || "";
    document.getElementById("contactMethod").value = p.contactMethod || "Email";
  }
  renderProfile();
})();
</script>

</body>
</html>
