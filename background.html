<!DOCTYPE html>
<html>
<head>
  <title>Background Check | Special Space</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #1a0033;
      color: white;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 220px;
      height: 100%;
      background-color: black;
      padding-top: 20px;
      overflow-y: auto;
    }

    .sidebar a {
      text-decoration: none;
    }

    .sidebar button {
      display: block;
      width: 80%;
      margin: 10px auto;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
      font-family: Arial, sans-serif;
    }

    .sidebar button:hover {
      background-color: #d9d9d9;
    }

    .main {
      margin-left: 220px;
      padding: 40px;
      max-width: 1100px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 42px;
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .box {
      background: #2a0055;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .box h2 {
      margin-top: 0;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: #140026;
      color: white;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input[type="checkbox"] {
      width: auto;
      margin-right: 8px;
    }

    .submit-btn,
    .action-btn {
      background: white;
      color: black;
      font-weight: bold;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-btn:hover,
    .action-btn:hover {
      background: #d9d9d9;
    }

    .danger-btn {
      background: #ff4d4d;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    .record {
      background: #140026;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .status-pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 8px;
      background: #3a0a66;
    }

    .small {
      font-size: 14px;
      opacity: 0.9;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      margin-top: 12px;
      margin-bottom: 12px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 900px) {
      .main {
        margin-left: 0;
        padding: 20px;
      }

      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        padding-bottom: 20px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="sidebar">
  <a href="index.html"><button>Home</button></a>
  <a href="dashboard.html"><button>Dashboard</button></a>
  <a href="events.html"><button>Events</button></a>
  <a href="volunteer.html"><button>Volunteer</button></a>
  <a href="jobs.html"><button>Open Jobs</button></a>
  <a href="appointments.html"><button>Appointments</button></a>
  <a href="families.html"><button>Families</button></a>
  <a href="success.html"><button>Success Stories</button></a>
  <a href="health.html"><button>Health Info</button></a>
  <a href="background.html"><button>Background Check</button></a>
  <a href="newsletter.html"><button>Newsletter</button></a>
  <a href="help.html"><button>Help</button></a>
  <a href="contact.html"><button>Contact</button></a>
  <a href="login.html"><button>Login</button></a>
  <button onclick="alert('Logout')">Logout</button>
</div>

<div class="main">
  <h1>Background Check</h1>

  <div class="grid">
    <div class="box">
      <h2>Start Background Check</h2>

      <form id="bgForm">
        <label>Full Name *</label>
        <input type="text" id="fullName" required>

        <label>Email *</label>
        <input type="email" id="email" required>

        <label>Phone *</label>
        <input type="text" id="phone" required>

        <label>Date of Birth *</label>
        <input type="date" id="dob" required>

        <label>SSN / Last 4 Digits *</label>
        <input type="text" id="ssn" placeholder="1234 or full SSN" required>

        <label>Address *</label>
        <input type="text" id="address" required>

        <label>Check Type *</label>
        <select id="checkType" required>
          <option value="">Select check type</option>
          <option value="Employment Check">Employment Check</option>
          <option value="Tenant Check">Tenant Check</option>
          <option value="Volunteer Check">Volunteer Check</option>
          <option value="Criminal Record Check">Criminal Record Check</option>
        </select>

        <label>Upload ID *</label>
        <input type="file" id="idUpload" accept=".jpg,.jpeg,.png,.pdf" required>

        <label>Reason / Notes</label>
        <textarea id="notes"></textarea>

        <div class="checkbox-row">
          <input type="checkbox" id="consent" required>
          <span>I confirm I have consent to run this background check.</span>
        </div>

        <button class="submit-btn" type="submit">Submit Background Check</button>
      </form>
    </div>

    <div class="box">
      <h2>Check Requests</h2>
      <div id="requestsList"></div>
      <button class="action-btn" onclick="clearAll()">Clear All</button>
    </div>
  </div>

  <div class="box" style="margin-top: 25px;">
    <h2>Results Panel</h2>
    <div id="resultsPanel" class="small">
      No check selected yet.
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = "background_check_requests_v1";
  let requests = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

  function saveRequests() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(requests));
  }

  function escapeHtml(str) {
    return String(str || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function renderRequests() {
    const list = document.getElementById("requestsList");
    list.innerHTML = "";

    if (requests.length === 0) {
      list.innerHTML = "<p class='small'>No background check requests submitted yet.</p>";
      return;
    }

    requests.forEach((req, index) => {
      const div = document.createElement("div");
      div.className = "record";
      div.innerHTML = `
        <h3>${escapeHtml(req.fullName)}</h3>
        <div>${escapeHtml(req.checkType)}</div>
        <div class="small">${escapeHtml(req.email)} | ${escapeHtml(req.phone)}</div>
        <div class="status-pill">${escapeHtml(req.status)}</div>
        <br>
        <button class="action-btn" onclick="viewResult(${index})">View</button>
        <button class="danger-btn" onclick="deleteRequest(${index})">Delete</button>
      `;
      list.appendChild(div);
    });
  }

  function viewResult(index) {
    const req = requests[index];
    const panel = document.getElementById("resultsPanel");

    panel.innerHTML = `
      <h3>${escapeHtml(req.fullName)}</h3>
      <p><strong>Type:</strong> ${escapeHtml(req.checkType)}</p>
      <p><strong>Email:</strong> ${escapeHtml(req.email)}</p>
      <p><strong>Phone:</strong> ${escapeHtml(req.phone)}</p>
      <p><strong>DOB:</strong> ${escapeHtml(req.dob)}</p>
      <p><strong>Address:</strong> ${escapeHtml(req.address)}</p>
      <p><strong>Status:</strong> ${escapeHtml(req.status)}</p>
      <p><strong>ID File:</strong> ${escapeHtml(req.idFileName)}</p>
      <p><strong>Notes:</strong> ${escapeHtml(req.notes)}</p>
      <hr>
      <p><strong>Result:</strong> Demo result only. Connect this page to a backend API to run a real background screening.</p>
    `;
  }

  function deleteRequest(index) {
    requests.splice(index, 1);
    saveRequests();
    renderRequests();
    document.getElementById("resultsPanel").innerHTML = "No check selected yet.";
  }

  function clearAll() {
    requests = [];
    saveRequests();
    renderRequests();
    document.getElementById("resultsPanel").innerHTML = "No check selected yet.";
  }

  document.getElementById("bgForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const idFile = document.getElementById("idUpload").files[0];

    const request = {
      fullName: document.getElementById("fullName").value.trim(),
      email: document.getElementById("email").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      dob: document.getElementById("dob").value,
      ssn: document.getElementById("ssn").value.trim(),
      address: document.getElementById("address").value.trim(),
      checkType: document.getElementById("checkType").value,
      notes: document.getElementById("notes").value.trim(),
      idFileName: idFile ? idFile.name : "No file",
      consent: document.getElementById("consent").checked,
      status: "Submitted"
    };

    requests.unshift(request);
    saveRequests();
    renderRequests();
    this.reset();
  });

  renderRequests();
</script>
</body>
</html>
